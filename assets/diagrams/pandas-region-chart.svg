  <g font-family="Arial, sans-serif" font-size="15"><rect x="360" y="478" width="18" height="18" rx="3" fill="#2563eb"/><text x="386" y="493" fill="#334155">Revenue</text><rect x="520" y="478" width="18" height="18" rx="3" fill="#22c55e"/><text x="546" y="493" fill="#334155">Gross Profit</text></g>
