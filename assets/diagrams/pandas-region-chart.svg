<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Revenue and gross profit by region</title><desc id="desc">A grouped bar chart comparing revenue and gross profit for Delhi, Kanpur, and Lucknow.</desc>
  <rect width="1000" height="520" rx="24" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Regional performance at a glance</text>
  <g stroke="#cbd5e1" stroke-width="1"><line x1="110" y1="420" x2="930" y2="420"/><line x1="110" y1="330" x2="930" y2="330"/><line x1="110" y1="240" x2="930" y2="240"/><line x1="110" y1="150" x2="930" y2="150"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#475569"><text x="92" y="425" text-anchor="end">0</text><text x="92" y="335" text-anchor="end">2k</text><text x="92" y="245" text-anchor="end">4k</text><text x="92" y="155" text-anchor="end">6k</text></g>
