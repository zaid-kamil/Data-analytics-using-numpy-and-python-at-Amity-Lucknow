<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">The data analysis workflow</title>
  <desc id="desc">A six-step path from loading data to making a recommendation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">The data detective's route</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Good answers come from following the steps, not from guessing confidently.</text>

  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)">
    <line x1="185" y1="155" x2="220" y2="155"/>
    <line x1="375" y1="155" x2="410" y2="155"/>
    <line x1="565" y1="155" x2="600" y2="155"/>
    <line x1="755" y1="155" x2="790" y2="155"/>
    <line x1="945" y1="155" x2="980" y2="155"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="30" y="105" width="155" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="107" y="148" font-size="20" font-weight="700" fill="#1e3a8a">1. Load</text><text x="107" y="177" font-size="14" fill="#1e40af">Bring in the CSVs</text></g>
    <g><rect x="220" y="105" width="155" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="297" y="148" font-size="20" font-weight="700" fill="#0c4a6e">2. Inspect</text><text x="297" y="177" font-size="14" fill="#075985">Meet the columns</text></g>
    <g><rect x="410" y="105" width="155" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="487" y="148" font-size="20" font-weight="700" fill="#14532d">3. Clean</text><text x="487" y="177" font-size="14" fill="#166534">Handle the mischief</text></g>
    <g><rect x="600" y="105" width="155" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="677" y="148" font-size="20" font-weight="700" fill="#78350f">4. Calculate</text><text x="677" y="177" font-size="14" fill="#92400e">Create useful metrics</text></g>
    <g><rect x="790" y="105" width="155" height="100" rx="18" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/><text x="867" y="148" font-size="20" font-weight="700" fill="#701a75">5. Compare</text><text x="867" y="177" font-size="14" fill="#86198f">Find the leaders</text></g>
    <g><rect x="980" y="105" width="185" height="100" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="1072" y="148" font-size="20" font-weight="700" fill="#881337">6. Recommend</text><text x="1072" y="177" font-size="14" fill="#9f1239">Explain with evidence</text></g>
  </g>
  <text x="600" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Raw rows in → checked evidence out</text>
</svg>
